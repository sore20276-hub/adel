plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adel.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.adel.app"
        minSdk 24
        targetSdk 35
        versionCode 31
        versionName "3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
